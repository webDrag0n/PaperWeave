name: 功能建议 / Feature request
description: 提出新功能或改进 / Suggest a feature or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景 / Use case
      description: 你想完成什么事，现在卡在哪里 / What are you trying to do, and what gets in the way
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案 / Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围 / Scope
      description: 勾选你认为会涉及的部分 / Tick what you expect this to touch
      options:
        - label: 界面 / UI
        - label: Agent API 或 MCP 契约 / Agent API or MCP contract
        - label: 数据存储格式 / Stored data format
        - label: 浏览器插件 / Browser extension
  - type: checkboxes
    id: contribute
    attributes:
      label: 参与 / Contribution
      options:
        - label: 我愿意提交 PR / I am willing to open a PR
