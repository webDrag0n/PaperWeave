name: 缺陷报告 / Bug report
description: 报告一个可以复现的问题 / Report a reproducible problem
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。中英文均可。安全问题请不要在这里提交，参见 SECURITY.md。
        Thanks for the report. English or Chinese is fine. Do not file security issues here; see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: PaperWeave 版本 / Version
      description: 见安装包文件名，或访问 http://127.0.0.1:24680/api/ping
      placeholder: "1.3.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统 / OS
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及的部分 / Area
      options:
        - 阅读器与批注 / Reader & annotations
        - 论文库与导入 / Library & import
        - 引用抓取与下载 / Citation fetch & download
        - 引用图谱与时间线 / Graph & timeline
        - Agent API / MCP
        - 浏览器插件 / Browser extension
        - 安装与打包 / Install & packaging
        - 其他 / Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 涉及具体论文时请给出 arXiv 编号或 DOI / Include the arXiv id or DOI if a specific paper is involved
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为 / Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为 / Actual behavior
      description: 可附截图与报错信息 / Screenshots and error messages help
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息 / Additional context
      description: 安装方式（安装包 / 便携版 / 源码）、是否设置了环境变量等。请不要粘贴 agent-api.json 中的令牌。
