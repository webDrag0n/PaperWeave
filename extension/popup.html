<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>PaperWeave Connector</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="popup">
  <header class="pw-header">
    <img src="icons/icon-48.png" alt="" class="pw-logo">
    <span class="pw-brand">PaperWeave</span>
    <span id="connDot" class="conn-dot" title=""></span>
  </header>

  <main>
    <!-- 默认立即可见：后台发现、连接、读取论文库和识别论文的进度 -->
    <section id="loadingView">
      <div class="loading-head">
        <span class="spinner" aria-hidden="true"></span>
        <h2 id="loadingTitle">正在准备 PaperWeave</h2>
      </div>
      <p id="loadingStage" class="loading-stage">正在读取当前页面…</p>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="5">
        <div id="loadingBar" class="progress-fill" style="width:5%"></div>
      </div>
      <ol id="loadingLog" class="loading-log"></ol>
    </section>

    <!-- 连接或识别失败 -->
    <section id="errorView" class="hidden">
      <div class="empty-icon">🧩</div>
      <p id="errorText" class="empty-text">暂时无法连接 PaperWeave</p>
      <button id="retryBtn" class="btn btn-primary" data-zh="重试" data-en="Retry">重试</button>
      <button id="openOptions1" class="link-btn" data-zh="高级连接设置" data-en="Advanced connection settings">高级连接设置</button>
    </section>

    <!-- 识别到论文 -->
    <section id="paperView" class="hidden">
      <div class="paper-card">
        <span id="paperKind" class="kind-badge">arXiv</span>
        <h2 id="paperTitle" class="paper-title"></h2>
        <p id="paperAuthors" class="paper-authors"></p>
        <p id="paperMeta" class="paper-meta"></p>
      </div>
      <label class="library-picker" for="librarySelect">
        <span data-zh="保存到论文库" data-en="Save to library">保存到论文库</span>
        <select id="librarySelect"></select>
      </label>
      <button id="saveBtn" class="btn btn-primary btn-save" data-zh="📥 保存到 PaperWeave" data-en="📥 Save to PaperWeave">📥 保存到 PaperWeave</button>
      <div id="resultBox" class="result hidden"></div>
    </section>

    <!-- 未识别到论文 -->
    <section id="noPaperView" class="hidden">
      <div class="empty-icon">📄</div>
      <p class="empty-text" data-zh="当前页面未识别到论文信息" data-en="No paper detected on this page">当前页面未识别到论文信息</p>
      <p class="empty-sub" data-zh="支持 arXiv 摘要 / PDF 页面及带 citation 元数据的出版商页面" data-en="Works on arXiv abstract / PDF pages and publisher pages with citation metadata">支持 arXiv 摘要 / PDF 页面及带 citation 元数据的出版商页面</p>
    </section>
  </main>

  <footer class="pw-footer">
    <span id="connStatus" class="conn-status"></span>
    <button id="openOptions2" class="link-btn" data-zh="⚙ 设置" data-en="⚙ Settings">⚙ 设置</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
