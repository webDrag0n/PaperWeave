<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>PaperWeave Connector 设置</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="options">
  <h1><img src="icons/icon-48.png" alt=""><span>PaperWeave Connector</span></h1>
  <p class="sub" data-zh="把浏览器里的论文一键保存到 PaperWeave 桌面端" data-en="Save papers from your browser into the PaperWeave desktop app">把浏览器里的论文一键保存到 PaperWeave 桌面端</p>

  <div class="field">
    <label data-zh="服务地址（PaperWeave 桌面端 Agent API）" data-en="Server URL (PaperWeave desktop Agent API)">服务地址（PaperWeave 桌面端 Agent API）</label>
    <input id="serverUrl" type="text" placeholder="http://127.0.0.1:24680" spellcheck="false">
  </div>
  <div class="field">
    <label data-zh="访问令牌（X-PaperWeave-Token）" data-en="Access token (X-PaperWeave-Token)">访问令牌（X-PaperWeave-Token）</label>
    <input id="token" type="text" placeholder="32 位十六进制令牌" spellcheck="false" autocomplete="off">
  </div>
  <div class="actions">
    <button id="saveBtn" class="btn btn-primary" data-zh="保存" data-en="Save">保存</button>
    <button id="testBtn" class="btn" data-zh="测试连接" data-en="Test connection">测试连接</button>
  </div>
  <div id="optStatus"></div>

  <div class="help" data-zh="💡 通常无需在此配置。插件会自动发现本地 PaperWeave 并静默连接，无需桌面端确认或填写 API Key。此页仅用于端口被修改、旧版本迁移或手动排查等高级场景。" data-en="💡 Usually no setup is needed. The connector detects and connects to PaperWeave automatically without desktop approval or API keys. Use this page only for custom ports, legacy migration, or advanced troubleshooting.">💡 通常无需在此配置。插件会自动发现本地 PaperWeave 并静默连接，无需桌面端确认或填写 API Key。此页仅用于端口被修改、旧版本迁移或手动排查等高级场景。</div>

  <script src="options.js"></script>
</body>
</html>
